services:
  netatmo-viewer:
    image: ghcr.io/lambdan/netatmo-viewer:latest
    # build: .   # to build from source instead of pulling
    container_name: netatmo-viewer
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      # Keeps the rotated Netatmo refresh token across restarts.
      - netatmo-data:/data

volumes:
  netatmo-data:
