services:
  netatmo-viewer:
    image: ghcr.io/lambdan/netatmo-viewer:latest
    # build: .   # to build from source instead of pulling
    container_name: netatmo-viewer
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # Set DATABASE_URL in .env to use a Postgres you already run (and remove the db service).
      DATABASE_URL: ${DATABASE_URL:-postgres://netatmo:${POSTGRES_PASSWORD:-netatmo}@db:5432/netatmo}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: netatmo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: netatmo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netatmo}
      POSTGRES_DB: netatmo
    volumes:
      - netatmo-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netatmo -d netatmo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  netatmo-pg:
